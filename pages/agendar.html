<!doctype html>
<!-- Idioma da página: português do Brasil. -->
<html lang="pt-BR">
<head>
<!-- Codificação dos caracteres (os acentos funcionam). -->
<meta charset="utf-8">
<!-- Faz a página se ajustar à largura do celular. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Título que aparece na aba do navegador. -->
<!-- Ícone da aba do navegador. -->
<link rel="icon" type="image/png" href="../img/favicon.png">
<title>Agendar consulta · AgendaFácil</title>
<!-- Liga o arquivo de estilos (cores e layout). -->
<link rel="stylesheet" href="../css/style.css?v=12">
</head>
<!-- data-page diz ao main.js qual tela é esta. -->
<body data-page="agendar">
<!-- Espaço da barra do topo: o main.js a desenha conforme quem está logado. -->
<header class="topo" id="topo"></header>
<!-- Conteúdo principal da página. -->
<main>
<!-- Coluna estreita; o título muda para 'Reagendar consulta' ao reagendar. -->
<div class="estreito" style="margin:auto"><h1 id="tituloAg">Agendar consulta</h1>
<!-- Cartão com todos os passos do agendamento. -->
<div class="card">
<!-- Escolha da clínica (só aparece quando há mais de uma disponível). -->
<div id="boxClinica" hidden><label for="clin" style="margin-top:0">Clínica</label><select id="clin"></select></div>
<!-- Grupo de opções: tipo de consulta (o main.js cria os botões). -->
<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:.9rem">Tipo de consulta</legend><div class="opcoes" id="tipos" style="margin-top:.4rem"></div></fieldset>
<!-- Seletor de especialidade (filtro). -->
<label for="esp">Especialidade</label><select id="esp"></select>
<!-- Seletor de profissional. -->
<label for="prof">Profissional</label><select id="prof"></select>
<!-- Escolha da data. -->
<label for="data">Data</label><input id="data" type="date">
<!-- Título da grade de horários. -->
<label style="margin-top:1.2rem" id="lh">Horários livres</label>
<!-- Grade onde o main.js coloca os horários livres. -->
<div id="horarios" class="horarios" aria-labelledby="lh"></div>
<!-- Espaço do botão 'Avisar-me se vagar' (aparece quando não há horários). -->
<div id="espera" style="margin-top:.8rem"></div>
<!-- Convênio (opcional). -->
<label for="convenio">Convênio (deixe em branco se for particular)</label><input id="convenio" placeholder="Particular">
<!-- Botão de confirmar: só habilita depois de escolher um horário. -->
<button id="confirmar" class="btn cheio" disabled>Confirmar agendamento</button>
</div></div>
</main>
<!-- Quadro das mensagens flutuantes (o main.js escreve aqui). -->
<div id="aviso" role="status" aria-live="polite"></div>
<!-- API falsa (só é usada quando USE_MOCK = true em api.js). -->
<script src="../js/mock.js?v=12"></script>
<!-- Comunicação com a API (servidor PHP). -->
<script src="../js/api.js?v=12"></script>
<!-- Lógica da tela. -->
<script src="../js/main.js?v=12"></script>
</body>
</html>
