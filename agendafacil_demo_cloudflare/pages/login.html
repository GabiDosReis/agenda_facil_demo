<!doctype html>
<!-- Idioma da página: português do Brasil. -->
<html lang="pt-BR">
<head>
<!-- Codificação dos caracteres (os acentos funcionam). -->
<meta charset="utf-8">
<!-- Faz a página se ajustar à largura do celular. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Título que aparece na aba do navegador. -->
<!-- Ícone da aba do navegador. -->
<link rel="icon" type="image/png" href="../img/favicon.png">
<title>Entrar · AgendaFácil</title>
<!-- Liga o arquivo de estilos (cores e layout). -->
<link rel="stylesheet" href="../css/style.css?v=12">
</head>
<!-- data-page diz ao main.js qual tela é esta. -->
<body data-page="login">
<!-- Espaço da barra do topo: o main.js a desenha conforme quem está logado. -->
<header class="topo" id="topo"></header>
<!-- Conteúdo principal da página. -->
<main>
<!-- Coluna estreita e centralizada. -->
<div class="estreito" style="margin:1rem auto">
<!-- Caixa de título da tela. -->
<!-- Escolha do tipo de acesso: uso pessoal (paciente) ou empresarial (clínica). O main.js troca os textos e envia o tipo ao servidor. -->
<div class="tabs dois" role="tablist" aria-label="Tipo de acesso">
<button type="button" role="tab" id="tabPaciente" data-tipo="paciente" aria-selected="true">Uso pessoal</button>
<button type="button" role="tab" id="tabClinica" data-tipo="clinica" aria-selected="false">Uso clínico</button></div>
<!-- Caixa de título da tela (o texto muda conforme a aba). -->
<div class="titulo-pill"><h1 style="margin:0" id="tituloLogin">Bem-vindo de volta</h1><p id="subLogin">Entre para agendar e acompanhar suas consultas.</p></div>
<!-- Mensagem de aviso (ex.: conta criada). -->
<p id="info" class="msg" role="status"></p>
<!-- Formulário de login: o main.js trata o envio (novalidate: a validação é feita por nós). -->
<form id="form" novalidate>
<!-- Campo de e-mail (o 'for' liga o rótulo ao campo). -->
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
<!-- Campo de senha (type=password esconde o que é digitado). -->
<label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
<!-- Espaço para a mensagem de erro. -->
<p id="erro" class="erro" role="alert"></p>
<!-- Botão que envia o formulário. -->
<button class="btn cheio pilula" type="submit">Entrar</button></form>
<!-- Link para criar conta. -->
<p style="text-align:center;margin-top:1.2rem" id="linkCadastro">Novo por aqui? <a href="cadastro.html">Criar conta</a></p>
<!-- Dica dos dados de teste. -->
<!-- Dica dos dados de teste (muda conforme a aba). -->
<!-- Link para quem esqueceu a senha. -->
<p style="text-align:center;margin-top:.4rem"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
<p class="msg" style="text-align:center;font-size:.85rem" id="dicaLogin"></p></div>
</main>
<!-- Quadro das mensagens flutuantes (o main.js escreve aqui). -->
<div id="aviso" role="status" aria-live="polite"></div>
<!-- API falsa (só é usada quando USE_MOCK = true em api.js). -->
<script src="../js/mock.js?v=12"></script>
<!-- Comunicação com a API (servidor PHP). -->
<script src="../js/api.js?v=12"></script>
<!-- Lógica da tela. -->
<script src="../js/main.js?v=12"></script>
</body>
</html>
