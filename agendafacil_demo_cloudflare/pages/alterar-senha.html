<!doctype html>
<!-- Idioma da página: português do Brasil. -->
<html lang="pt-BR">
<head>
<!-- Codificação dos caracteres (os acentos funcionam). -->
<meta charset="utf-8">
<!-- Faz a página se ajustar à largura do celular. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Título que aparece na aba do navegador. -->
<!-- Ícone da aba do navegador. -->
<link rel="icon" type="image/png" href="../img/favicon.png">
<title>Alterar senha · AgendaFácil</title>
<!-- Liga o arquivo de estilos (cores e layout). -->
<link rel="stylesheet" href="../css/style.css?v=11">
</head>
<!-- data-page diz ao main.js qual tela é esta. -->
<body data-page="alterar-senha">
<!-- Espaço da barra do topo: o main.js a desenha conforme quem está logado. -->
<header class="topo" id="topo"></header>
<!-- Conteúdo principal da página. -->
<main>
<!-- Coluna estreita e centralizada. -->
<div class="estreito" style="margin:1rem auto">
<!-- Caixa de título da tela. -->
<div class="titulo-pill"><h1 style="margin:0">Alterar senha</h1><p>Informe a senha atual e escolha a nova.</p></div>
<!-- Formulário (o main.js trata o envio). -->
<form id="form" class="card" novalidate>
<!-- Senha atual, nova e confirmação. -->
<label for="atual">Senha atual</label><input id="atual" type="password" autocomplete="current-password" required>
<label for="senha">Nova senha (mínimo 8 caracteres)</label><input id="senha" type="password" autocomplete="new-password" required>
<label for="senha2">Repita a nova senha</label><input id="senha2" type="password" autocomplete="new-password" required>
<!-- Espaço para a mensagem de erro. -->
<p id="erro" class="erro" role="alert"></p>
<!-- Botão que envia a troca. -->
<button class="btn cheio pilula" type="submit">Salvar nova senha</button></form>
</div>
</main>
<!-- Quadro das mensagens flutuantes (o main.js escreve aqui). -->
<div id="aviso" role="status" aria-live="polite"></div>
<!-- API falsa (só é usada quando USE_MOCK = true em api.js). -->
<script src="../js/mock.js?v=11"></script>
<!-- Comunicação com a API (servidor PHP). -->
<script src="../js/api.js?v=11"></script>
<!-- Lógica da tela. -->
<script src="../js/main.js?v=11"></script>
</body>
</html>
