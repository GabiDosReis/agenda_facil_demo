<!doctype html>
<!-- Idioma da página: português do Brasil. -->
<html lang="pt-BR">
<head>
<!-- Codificação dos caracteres (os acentos funcionam). -->
<meta charset="utf-8">
<!-- Faz a página se ajustar à largura do celular. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Título que aparece na aba do navegador. -->
<!-- Ícone da aba do navegador. -->
<link rel="icon" type="image/png" href="../img/favicon.png">
<title>Criar conta · AgendaFácil</title>
<!-- Liga o arquivo de estilos (cores e layout). -->
<link rel="stylesheet" href="../css/style.css?v=11">
</head>
<!-- data-page diz ao main.js qual tela é esta. -->
<body data-page="cadastro">
<!-- Espaço da barra do topo: o main.js a desenha conforme quem está logado. -->
<header class="topo" id="topo"></header>
<!-- Conteúdo principal da página. -->
<main>
<!-- Coluna estreita e centralizada, com o título. -->
<div class="estreito" style="margin:auto">
<!-- Escolha do tipo de cadastro (uso pessoal = paciente; uso clínico = clínica): paciente (esta página) ou clínica (outra página). -->
<nav class="tabs dois" aria-label="Tipo de cadastro"><a href="cadastro.html" aria-current="page">Uso pessoal</a><a href="cadastro-clinica.html">Uso clínico</a></nav>
<h1>Criar conta</h1>
<!-- Formulário de cadastro do paciente (o main.js trata o envio). -->
<form id="form" class="card" novalidate>
<!-- Nome completo. -->
<label for="nome">Nome completo</label><input id="nome" autocomplete="name" required>
<!-- CPF (inputmode=numeric abre o teclado numérico no celular). -->
<label for="cpf">CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00" required>
<!-- Telefone (type=tel). -->
<label for="tel">Telefone</label><input id="tel" type="tel" autocomplete="tel" required>
<!-- E-mail. -->
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
<!-- Senha (mínimo de 8 caracteres). -->
<label for="senha">Senha (mínimo 8 caracteres)</label><input id="senha" type="password" autocomplete="new-password" required>
<!-- Confirmação da senha. -->
<label for="senha2">Confirmar senha</label><input id="senha2" type="password" autocomplete="new-password" required>
<!-- Caixa de aceite da política de privacidade (LGPD). -->
<label class="check" style="margin-top:1rem"><input id="lgpd" type="checkbox">Li e aceito a <a href="privacidade.html">política de privacidade</a>. Seus dados são usados somente para gerenciar seus agendamentos (LGPD).</label>
<!-- Espaço para a mensagem de erro. -->
<p id="erro" class="erro" role="alert"></p>
<!-- Botão que envia o formulário. -->
<button class="btn cheio" type="submit">Criar conta</button></form>
<!-- Link para o login. -->
<p>Já tem conta? <a href="login.html">Entrar</a></p></div>
</main>
<!-- Quadro das mensagens flutuantes (o main.js escreve aqui). -->
<div id="aviso" role="status" aria-live="polite"></div>
<!-- API falsa (só é usada quando USE_MOCK = true em api.js). -->
<script src="../js/mock.js?v=11"></script>
<!-- Comunicação com a API (servidor PHP). -->
<script src="../js/api.js?v=11"></script>
<!-- Lógica da tela. -->
<script src="../js/main.js?v=11"></script>
</body>
</html>
